{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-panel">
        <h1>Set a new password</h1>
        <form method="post" class="auth-form">
            <label for="password">New password</label>
            <input id="password" class="form-control" type="password" name="password" autocomplete="new-password" minlength="8" required>
            <label for="confirm_password">Confirm new password</label>
            <input id="confirm_password" class="form-control" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
            <button type="submit" class="btn btn-primary">Reset password</button>
        </form>
    </section>
</main>
{% endblock %}
