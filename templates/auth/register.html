{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-panel">
        <h1>Create account</h1>

        <form method="post" class="auth-form">
            <label for="username">Username</label>
            <input id="username" class="form-control" type="text" name="username" autocomplete="username" required>

            <label for="email">Email</label>
            <input id="email" class="form-control" type="email" name="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" class="form-control" type="password" name="password" autocomplete="new-password" required>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <p class="auth-alt">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </section>
</main>
{% endblock %}
