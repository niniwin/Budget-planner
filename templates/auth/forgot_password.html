{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-panel">
        <h1>Reset password</h1>
        <p class="auth-help">Enter your account email and we’ll send a password-reset link.</p>
        <form method="post" class="auth-form">
            <label for="email">Email</label>
            <input id="email" class="form-control" type="email" name="email" autocomplete="email" required>
            <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
        <p class="auth-alt"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
    </section>
</main>
{% endblock %}
