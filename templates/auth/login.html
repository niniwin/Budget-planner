{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-panel">
        <h1>Sign in</h1>

        {% if oauth_enabled %}
        <a class="btn btn-outline-primary auth-oauth-btn" href="{{ url_for('auth.oauth_login') }}">
            <i class="bi bi-person-circle"></i>
            Continue with {{ oauth_provider_name }}
        </a>

        <div class="auth-divider">or</div>
        {% endif %}

        <form method="post" class="auth-form">
            <label for="identity">Username or email</label>
            <input id="identity" class="form-control" type="text" name="identity" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required>

            <label class="auth-check">
                <input type="checkbox" name="remember" value="1">
                Remember me
            </label>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="auth-alt">
            <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        </p>

        <p class="auth-alt">
            New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>
    </section>
</main>
{% endblock %}
