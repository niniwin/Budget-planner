<table class="table table-bordered table-striped text-center transaction-table">
    <thead>
        <tr>
            <th class="money-col">Type</th>
            <th>Date</th>
            <th>Description</th>
            <th class="money-col">Amount</th>
            <th class="action-col">
                <svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706l-1.043 1.043-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293z"/>
                    <path d="M13.752 4.396l-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.815z"/>
                    <path d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                </svg>
            </th>
            <th class="action-col">
                <svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                </svg>
            </th>
        </tr>
    </thead>

    <tbody id="transactionsTable">
        {% for t in transactions %}
        <tr data-id="{{ t.id }}">
            <td>
                <select class="form-control" disabled>
                    <option value="income" {% if t.type == "income" %}selected{% endif %}>Income</option>
                    <option value="expense" {% if t.type == "expense" %}selected{% endif %}>Expense</option>
                </select>
            </td>
            <td>
                <input type="date" value="{{ t.date }}" class="form-control" disabled>
            </td>
            <td>
                <input type="text" value="{{ t.description }}" class="form-control" disabled>
            </td>
            <td>
                <input type="number" value="{{ t.amount }}" class="form-control" step="0.01" disabled>
            </td>
            <td>
                <button type="button" class="update-btn" onclick="editRow(this)">
                    <svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M15.502 1.94a.5.5 0 0 1 0 .706l-1.043 1.043-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293z"/>
                        <path d="M13.752 4.396l-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.815z"/>
                        <path d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                    </svg>
                </button>
            </td>
            <td>
                <button type="button" class="delete-btn" onclick="deleteRow(this)">
                    <svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                    </svg>
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>

    <tfoot>
        <tr>
            <td class="text-center" colspan="2">
                <button type="button" class="add-income-btn" onclick="addRow('income')">
                    <i class="bi bi-plus-circle"></i> Add Income
                </button>
            </td>
            <td class="text-center" colspan="2">
                <button type="button" class="add-expense-btn" onclick="addRow('expense')">
                    <i class="bi bi-plus-circle"></i> Add Expense
                </button>
            </td>
        </tr>
    </tfoot>
</table>
