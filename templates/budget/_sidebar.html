<button type="button" class="mobile-menu-btn" aria-label="Open budget menu" aria-expanded="false">
    <i class="bi bi-list"></i>
</button>

<div class="mobile-menu-backdrop"></div>

<nav class="budget-sidebar" aria-label="Budget navigation">
    <div class="sidebar-header">
        <div class="sidebar-logo">
    <img src="{{ url_for('static', filename='images/budget.png') }}"
         alt="Budget Planner Logo">
    <span>Budget Planner</span>
</div>
        <button type="button" class="mobile-menu-close" aria-label="Close budget menu">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <a href="{{ url_for('budget.planner') }}" class="sidebar-link">
        <i class="bi bi-table"></i> Transactions
    </a>

    <a href="{{ url_for('budget.daily_summary') }}" class="sidebar-link">
        <i class="bi bi-calendar-day"></i> Daily Summary
    </a>

    <a href="{{ url_for('report.monthly_report') }}" class="sidebar-link">
        <i class="bi bi-bar-chart"></i> Monthly Report
    </a>
    <a href="{{ url_for('budget.show_note') }}" class="sidebar-link">
        <i class="bi bi-journal-text"></i> Add Note
    </a>
    <a href="{{ url_for('auth.change_password') }}" class="sidebar-link">
        <i class="bi bi-key"></i> Change Password
    </a>
 
    <a href="{{ url_for('budget.backup_transactions') }}" class="sidebar-link">
        <i class="bi bi-download"></i> Backup Data
    </a>
    {% if current_user.is_authenticated and current_user.is_admin %}
    <a href="{{ url_for('auth.admin_users') }}" class="sidebar-link">
        <i class="bi bi-shield-lock"></i> Admin
    </a>
    {% endif %}
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('auth.logout') }}" class="sidebar-link">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
    {% endif %}
</nav>
