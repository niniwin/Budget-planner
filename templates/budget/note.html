{% extends "base.html" %}
{% block title %}Note{% endblock %}

{% block content %}
<div class="budget-layout">
    {% include "budget/_sidebar.html" %}

    <main class="budget-content">
        <div class="diary-box">
            <h2 class="page-heading text-center mb-4">
                Note
            </h2>
              <!-- Add New Note -->
            <form action="{{ url_for('budget.add_note') }}" method="POST">

                <div class="mb-3">
                    <textarea
                        class="form-control"
                        name="note"
                        rows="6"
                        placeholder="Write your note here..."
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Save
                </button>

            </form>

            <hr>

           <!-- Saved Notes -->
            <h5 class="mb-3">Saved Notes</h5>

            {% for note in notes %}

            <div class="card shadow-sm mb-3 note-card">
                <div class="card-body note-card-body">

                    <div class="row g-2 align-items-center">

                        <!-- Update Form -->
                        <div class="col">
                            <form action="{{ url_for('budget.edit_note', id=note.id) }}" method="POST" class="d-flex gap-2">

                                <input
                                    type="text"
                                    class="form-control note-input"
                                    name="note"
                                    value="{{ note.content }}"
                                    required>

                                <button
                                    type="button"
                                    onclick="editNote(this)"
                                    class="btn btn-warning note-btn">
                                    Update
                                </button>
                                <button
                                    type="submit"
                                    style="display:none"
                                    class="btn btn-success"
                                >
                                Save

                                </button>


                            </form>
                        </div>

                        <!-- Delete Form -->
                        <div class="col-auto">
                            <form action="{{ url_for('budget.delete_note', id=note.id) }}" method="POST">

                                <button
                                    type="button"
                                    onclick="deleteNote('{{note.id}}')"
                                    class="btn btn-danger note-btn">
                                    Delete
                                </button>

                            </form>
                        </div>

                    </div>

                </div>
            </div>

            {% else %}

            <div class="alert alert-secondary text-center">
                No notes available.
            </div>

            {% endfor %}
        </div>
    
    </main>
    </div>
{% endblock %}
